<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect to Black Box</title><style>body{font:16px system-ui;color:#41321a;background:#f6efe0;margin:0;padding:24px}main{max-width:480px;margin:8vh auto;background:#fffdf5;padding:28px;border:1px solid #e8dab9;border-radius:20px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font:inherit;border:1px solid #d9c69c;border-radius:10px}button{background:#9a641d;color:white;cursor:pointer}p{line-height:1.5;color:#7d6c4e}.error{color:#b42318}label{display:block;margin-top:12px}</style><main><h1>Connect to Black Box</h1><div id="content">Checking sign-in...</div><p id="error" class="error" role="alert"></p></main><script>
const root=document.querySelector('#content'),err=document.querySelector('#error'),params=location.search;let context;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch('/api'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return r.json()}
async function load(){context=await api('/oauth/context'+params);if(context.error==='auth'){root.innerHTML='<p>Sign into your Black Box workspace. Your bot stays signed into its own provider.</p><form id="login"><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required minlength="8"></label><button>Sign in</button></form>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const j=await api('/auth/login',{email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(j.error)err.textContent=j.error;else{err.textContent='';await load()}};return}if(context.error){root.textContent=context.error;return}
root.innerHTML='<p><b>'+esc(context.client)+'</b> wants to connect one bot to your workspace.</p><p>This connection can report activity and call Black Box tools under this bot\'s permissions. It cannot import your provider account, read other bots, or move money. This authorization can renew automatically in clients that support OAuth refresh. It stays available until you revoke this bot in Black Box.</p><label>Existing bot<select id="bot">'+context.bots.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+' ('+esc(a.provider)+')</option>').join('')+'</select></label><p>Return address: '+esc(context.redirectOrigin)+'</p><button id="allow" '+(context.bots.length?'':'disabled')+'>Authorize connection</button><p>If your bot is missing, open HQ and start Connect AI Employee first.</p>';document.querySelector('#allow').onclick=async()=>{document.querySelector('#allow').disabled=true;const j=await api('/oauth/consent',{csrf:context.csrf,agentId:document.querySelector('#bot').value});if(j.error){err.textContent=j.error;document.querySelector('#allow').disabled=false}else location.assign(j.redirect)}}
load().catch(()=>{err.textContent='Could not load sign-in. Reconnect from your bot.'});
</script></html>
