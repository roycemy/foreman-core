<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Job receipt | Black Box</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f1ed;color:#20221f;font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:36px 22px}.brand{font-size:13px;letter-spacing:2px;font-weight:700;display:flex;align-items:center;gap:9px}.mark{height:15px;width:15px;border:2px solid #20221f;box-shadow:inset 0 0 0 3px #f2f1ed}.mark:after{content:'';display:block;width:5px;height:2px;background:#da412b;margin:4px 3px}.card{background:#fff;border:1px solid #dadcd5;border-radius:22px;margin-top:32px;padding:32px}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:11px;font-weight:650;color:#677062}h1{font-size:38px;line-height:1.1;letter-spacing:-1.3px;margin:16px 0 22px;overflow-wrap:anywhere}p{white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid #e8e9e4;padding:20px 0;gap:15px;margin:26px 0}.stat small{display:block;font-size:11px;color:#6e746a}.stat b{font-size:21px;display:block;line-height:1.4}.note{color:#697064;font-size:12px}.template{background:#f6f7f3;padding:18px;border-radius:12px;margin-top:18px}.template p{font-size:14px;margin-bottom:0}.button{background:#d13b25;border:0;color:#fff;padding:15px 23px;border-radius:12px;font:650 15px system-ui;cursor:pointer;margin-top:22px;width:100%}.foot{font-size:12px;color:#70756d;margin-top:22px}.copy{color:#1f6f50;font-size:13px}textarea{width:100%;height:160px;border:1px solid #ccc;padding:12px}a{color:inherit}@media(max-width:540px){main{padding:24px 16px}.card{padding:24px 20px;margin-top:24px}h1{font-size:31px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.stat b{font-size:20px}}
</style><main><div class="brand"><i class="mark"></i>BLACK BOX</div><article class="card" id="card"><span class="eyebrow">Public job receipt</span><h1 id="title">Loading receipt</h1><div id="content"></div></article><p class="foot">A reviewed snapshot, not a guarantee that another bot will produce the same result. <a href="/hq">Open Black Box</a></p></main><script>
(async()=>{const q=s=>document.querySelector(s),token=location.pathname.split('/').pop(),card=q('#card');try{if(token!=='example'&&!/^[a-f0-9]{48}$/.test(token))throw Error();const r=await fetch('/api/public-receipts/'+token);if(!r.ok)throw Error();const d=await r.json();q('#title').textContent=d.title;const content=q('#content');content.innerHTML='<p id="summary"></p><div class="stats"><div class="stat"><small>Recorded outcome</small><b id="outcome"></b></div><div class="stat"><small>Elapsed wall-clock time</small><b id="elapsed"></b></div><div class="stat"><small>External cost</small><b>Not verified</b></div></div><p class="note" id="ledger"></p><div class="template"><span class="eyebrow">Reusable job template</span><p id="template"></p></div><button class="button" id="run">Run this job</button><p class="copy" id="copy" role="status" aria-live="polite"></p><textarea id="fallback" hidden readonly aria-label="Job template to copy"></textarea><p class="note" id="provenance"></p><p class="note" id="expiry"></p>';q('#summary').textContent=d.summary;q('#outcome').textContent=d.outcome==='example'?'Design example':d.outcome==='completed'?'Completed':'Failed';q('#elapsed').textContent=d.elapsedSeconds==null?'Not tracked':d.elapsedSeconds<60?d.elapsedSeconds+' sec':Math.floor(d.elapsedSeconds/60)+' min '+d.elapsedSeconds%60+' sec';q('#ledger').textContent=d.ledgerCents==null?'Gateway ledger: not tracked.':'Gateway ledger: '+d.ledgerCents+' cents across '+d.trackedActions+' retained linked actions. Not a payment or total provider spend.';q('#template').textContent=d.template;q('#provenance').textContent=d.provenance;q('#expiry').textContent=d.expiresAt?'Snapshot expires '+new Date(d.expiresAt).toLocaleDateString()+'.':'No real receipt published.';q('#run').onclick=async()=>{try{await navigator.clipboard.writeText(d.template);q('#copy').textContent='Template copied. Paste it into your bot or Black Box. Nothing has run or been charged.';}catch{const f=q('#fallback');f.hidden=false;f.value=d.template;f.focus();f.select();q('#copy').textContent='Copy the template below. Nothing has run or been charged.';}};}catch{q('#title').textContent='Receipt unavailable';q('#content').textContent='This link may have expired or been revoked. No private job details are shown.';}})();
</script></html>
