<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/app.css"><link rel="stylesheet" href="/pack/tools/fonts.css"><link rel="stylesheet" href="/pack/tokens.css">
<link rel="stylesheet" href="/pack/components/reconnect-flag.css"><link rel="stylesheet" href="/pack/components/receipt-ship.css"><link rel="stylesheet" href="/pack/components/bot-status.css"><link rel="stylesheet" href="/pack/components/estimate.css"><link rel="stylesheet" href="/pack/components/meeting.css"><link rel="stylesheet" href="/pack/components/bot-work.css">
<style>body{background:var(--a-floor);font-family:var(--a-font);color:var(--a-ink);margin:0;padding:40px}h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--a-ink-3);font-size:13px;margin:0 0 32px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,320px),1fr));gap:32px 28px;align-items:start}.cell>small{display:block;font-size:12px;color:var(--a-ink-3);margin-bottom:10px}
.tile{background:var(--a-floor);border:1px dashed var(--a-line-2);border-radius:18px;padding:20px;position:relative}
.rship{position:relative}.phone .g{grid-template-columns:1fr}body.phone{padding:20px}
.navdemo{display:flex;gap:4px;background:#fff;border-radius:12px;padding:8px;border:1px solid var(--a-line)} .tabsdemo{display:flex;background:var(--porcelain-phone);border-top:1px solid var(--a-line);height:64px}
.tabsdemo a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--tab-off);text-decoration:none}.tabsdemo a.on{color:var(--ink)} .tabsdemo svg{width:22px;height:22px}
.rowdemo{background:#fff;border:1px solid var(--a-line);border-radius:14px;overflow:hidden}.rowdemo .row{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 22px;border-top:1px solid var(--a-line);color:inherit;text-decoration:none}.rowdemo .row:first-child{border-top:0}.rowdemo .t{flex:1}.rowdemo b{display:block;font-weight:500;font-size:14px}.rowdemo small{color:var(--a-ink-3);font-size:12.5px}
.jobdemo{background:#fff;border:1px solid var(--a-line);border-radius:14px}.jobdemo .j{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--a-line)}.jobdemo .j:first-child{border-top:0}.jobdemo .st{margin-top:5px}.jobdemo b{display:block;font-weight:500;font-size:14px}.jobdemo small{display:block;color:var(--a-ink-3);font-size:12.5px}
.card{background:#fff;border:1px solid var(--a-line);border-radius:14px;padding:12px 16px}.av2{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.floorbit{height:120px;border-radius:14px;background:linear-gradient(#EDEDE8,#F4F4F1);position:relative;overflow:visible}
.tile .tabs svg{width:22px!important;height:22px!important}.tile .tabs a{flex:none!important}.tile .tabs{padding:10px 40px!important;height:auto!important;position:static!important;transform:none!important;inset:auto!important;width:auto!important;box-shadow:none!important}.tabsdemo a{position:relative;flex:1;padding-top:6px}.tabsdemo a .nnew{position:absolute;top:4px;left:calc(50% + 6px);height:16px;padding:0 5px;border-radius:999px;background:var(--a-red);color:#fff;font-size:10px;font-weight:600;line-height:16px;white-space:nowrap}</style></head><body><div id="root"></div>
<script>
const Q=new URLSearchParams(location.search),C=Q.get('c'),PH=innerWidth<=430;if(PH)document.body.classList.add('phone');
const R=document.getElementById('root'),tick='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8.5l3 3 7-7"/></svg>';
const cell=(cap,html,tile=true)=>`<div class="cell"><small>${cap}</small>${tile?`<div class="tile">${html}</div>`:html}</div>`;
const ICR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/></svg>',ICI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13l3-8h12l3 8v6H3z"/></svg>',ICC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>';
const S={
reconnect:['Reconnect flag','Sits above the crew pill in one column. Red only on the dot and edge. Copied and paste states are calm and black.',[
 ['Single bot · one action',`<div class="rcf"><div class="rcf-h">Grok Bot needs reconnecting</div><p class="rcf-why">Its session expired.</p><button class="rcf-act">Copy setup message</button></div>`],
 ['Copied · 1.6s, then the paste card',`<div class="rcf"><div class="rcf-h">Grok Bot needs reconnecting</div><p class="rcf-why">Its session expired.</p><div class="rcf-ok">${tick}Copied</div></div>`],
 ['Just paste · chat bot',`<div class="rcf paste"><div class="rcf-h">Paste it in Grok's chat</div><p class="rcf-why">The setup message is copied. Grok does the rest.</p><div class="rcf-row"><a class="rcf-act">Open Grok's chat</a></div></div>`],
 ['Just paste · console bot',`<div class="rcf paste"><div class="rcf-h">Enter this code in the console</div><p class="rcf-why">It works once, for the next 10 min.</p><div class="rcf-row"><span class="rcf-code">K7Q-42M</span></div></div>`],
 ['Several bots · one card',`<div class="rcf many"><div class="rcf-h">2 bots need reconnecting</div><ul class="rcf-list"><li><div><b>Grok Bot</b><small>Its session expired.</small></div><span class="rcf-ok">${tick}Copied</span></li><li><div><b>Muse</b><small>Its renewal token was used twice.</small></div><button class="rcf-act">Copy setup</button></li></ul></div>`],
 ['Reasons, plain words',['Its session expired.','Its renewal token was used twice.','Its saved login is missing.','Its access was revoked.','No check-in for over 30 min.'].map(w=>`<div class="rcf" style="margin-bottom:8px;box-shadow:none"><div class="rcf-h">Instinct needs reconnecting</div><p class="rcf-why" style="margin-bottom:0">${w}</p></div>`).join('')],
 ['Layout rule · flag stacks on the crew pill, gap 8',`<div class="a-corner" style="position:static;width:100%"><div class="rcf" style="width:100%"><div class="rcf-h">Grok Bot needs reconnecting</div><p class="rcf-why">Its session expired.</p><button class="rcf-act">Copy setup message</button></div><div class="card" style="display:flex;gap:12px;align-items:center;font-size:13px"><span class="av2" style="background:#121212">GB</span><b style="font-weight:600">Your team finished 3 jobs today.</b></div></div>`]]],
receipts:['Receipts that ship','Card flies from the bot to the Receipts tab in 800ms, ease-out. Badge is the one red. New rows get an ink dot and a soft wash for this visit.',[
 ['Receipt card · done',`<div class="rship"><div class="rship-who"><span class="av" style="--av:#2F55A4">M</span>Muse</div><b>Draft launch note</b><p>Launch note, three short paragraphs</p><div class="rship-foot"><span>Receipt</span><span>$0.04</span></div></div>`],
 ['Receipt card · didn\u2019t finish',`<div class="rship"><div class="rship-who"><span class="av" style="--av:#1F6F5C">I</span>Instinct</div><b>Check vendor invoice</b><p>Didn't finish</p><div class="rship-foot"><span>Receipt</span><span>–</span></div></div>`],
 ['Receipt card · cost not reported',`<div class="rship"><div class="rship-who"><span class="av" style="--av:#121212">GB</span>Grok Bot</div><b>Summarize inbox</b><p>Five items, two need replies</p><div class="rship-foot"><span>Receipt</span><span>–</span></div></div>`],
 ['Flight · 0 / 18 / 60 / 100%',`<svg viewBox="0 0 300 150" style="width:100%;display:block"><path d="M40 120 Q 150 -10 270 24" fill="none" stroke="#121212" stroke-opacity=".3" stroke-dasharray="2 5" stroke-linecap="round"/><rect x="18" y="104" width="46" height="30" rx="5" fill="#fff" stroke="rgba(18,18,18,.14)"/><rect x="128" y="40" width="30" height="20" rx="4" fill="#fff" stroke="rgba(18,18,18,.14)"/><rect x="262" y="18" width="10" height="7" rx="2" fill="#fff" stroke="rgba(18,18,18,.3)"/><text x="18" y="148" font-size="10" fill="#8C8C86" font-family="Geist">bot · scale 1</text><text x="120" y="76" font-size="10" fill="#8C8C86" font-family="Geist">arc · .62</text><text x="226" y="44" font-size="10" fill="#8C8C86" font-family="Geist">tab · .12</text></svg>`],
 ['Badge · desktop nav',`<div class="navdemo nav"><a style="padding:7px 12px;color:var(--stone)">Floor</a><a style="padding:7px 12px;color:var(--ink);background:rgba(18,18,18,.05);border-radius:8px">Receipts<span class="nnew">2 new</span></a><a style="padding:7px 12px;color:var(--stone)">Card</a></div>`],
 ['Badge · phone tab (landing target)',`<div class="tabsdemo"><a>${ICI}Inbox</a><a style="position:relative">${ICR}Receipts<span class="nnew">2 new</span></a><a>${ICC}Card</a></div>`],
 ['New rows · this visit, wash settles after 2.4s',`<div class="rowdemo list"><a class="row is-new"><span class="av2" style="background:#2F55A4">M</span><span class="t"><b>Draft launch note</b><small>Muse · Today 21:32 ET</small></span><span>$0.04</span></a><a class="row is-new"><span class="av2" style="background:#121212">GB</span><span class="t"><b>Summarize inbox</b><small>Grok Bot · Today 20:54 ET</small></span><span>$0.02</span></a><a class="row"><span class="av2" style="background:#1F6F5C">I</span><span class="t"><b>Check vendor invoice</b><small>Instinct · Today 20:14 ET</small></span><span>$0.01</span></a></div>`]]],
status:['Honest status','Working only when a job is truly running. Otherwise the last real check-in and a quiet reason.',[
 ['Working',`<div class="card"><div class="bst" data-s="working"><i class="bst-dot"></i><div class="bst-t"><b>Muse</b><span class="bst-line">Working · Draft launch note</span></div></div></div>`],
 ['Queued',`<div class="card"><div class="bst" data-s="queued"><i class="bst-dot"></i><div class="bst-t"><b>Grok Bot</b><span class="bst-line">Queued · last check-in 4 min ago</span><span class="bst-why">Grok checks in about every 5 min</span></div></div></div>`],
 ['Needs reconnect',`<div class="card"><div class="bst" data-s="reconnect"><i class="bst-dot"></i><div class="bst-t"><b>Grok Bot</b><span class="bst-line">Needs reconnect</span><span class="bst-why">Its session expired</span></div></div></div>`],
 ['Paused',`<div class="card"><div class="bst" data-s="paused"><i class="bst-dot"></i><div class="bst-t"><b>Scout</b><span class="bst-line">Paused</span><span class="bst-why">You paused this bot</span></div></div></div>`],
 ['Long job title truncates on one line (desktop); wraps on phone',`<div class="card"><div class="bst" data-s="working"><i class="bst-dot"></i><div class="bst-t"><b>Instinct</b><span class="bst-line">Working · Research competitor pricing for the three new regions</span></div></div></div>`]]],
estimate:['Job time estimate','Inspector job rows. Whole minutes, a tilde, the word estimate. No bars, no seconds. Refreshes once a minute.',[
 ['All four, as they sit in the job list',`<div class="jobdemo"><div class="j"><span class="st run"><i></i></span><div><b>Research competitor pricing</b><small>Running · started 2 min ago</small><span class="est" data-k="left">~4 min left (estimate)</span></div></div><div class="j"><span class="st run"><i></i></span><div><b>Draft launch note</b><small>Running · started 11 min ago</small><span class="est" data-k="long">Taking longer than usual (usually about 6 min)</span></div></div><div class="j"><span class="st q"><i></i></span><div><b>Tidy notes</b><small>Queued</small><span class="est" data-k="usual">Usually about 6 min once started (estimate)</span></div></div><div class="j"><span class="st run"><i></i></span><div><b>Plan the week</b><small>Running · started 3 min ago</small><span class="est" data-k="none">No estimate yet</span></div></div></div>`],
 ['Rule',`<div class="card" style="font-size:13px;line-height:20px;color:var(--a-ink-2)">Median of the bot's last 10 finished jobs, at least 3.<br>Fewer than 3: No estimate yet.<br>Running, more than 1 min left: ~N min left.<br>Running, past median but within 25%: ~1 min left.<br>Running, over 125% of median: Taking longer than usual.<br>Queued: Usually about N min once started.</div>`]]],
motion:['Bots working and meeting','Floor overlays. Shown in context in shots/context/3x and 4x.',[
 ['Carry prop · crate, 0.46 of figure width',`<div class="floorbit" style="display:grid;place-items:center"><div style="width:60px">${'<svg viewBox="0 0 24 20"><polygon points="12,1 23,6 12,11 1,6" fill="#E2C9A0"/><polygon points="1,6 12,11 12,19 1,14" fill="#C9A673"/><polygon points="23,6 12,11 12,19 23,14" fill="#B38F5E"/><polygon points="6.5,3.5 17.5,8.5 17.5,9.6 6.5,4.6" fill="#C99634" opacity=".7"/></svg>'}</div></div>`],
 ['Working indicator · 5px ink dot, slow pulse',`<div class="floorbit"><div class="wdot" style="left:50%;top:55%"></div></div>`],
 ['Handoff bubble · over the sender, 4.5s',`<div class="floorbit"><div class="mbub" style="left:50%;top:80%;animation:none">Handing you the research</div></div>`],
 ['Table glow · white, once, 600ms',`<div class="floorbit" style="display:grid;place-items:center"><svg viewBox="0 0 200 80" style="width:80%"><defs><radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><polygon points="100,20 170,45 100,70 30,45" fill="#E8E2D2"/><ellipse cx="100" cy="45" rx="80" ry="34" fill="url(#g)" opacity=".85"/></svg></div>`]]]
};
const [t,d,cells]=S[C];R.innerHTML=`<h1>${t} · ${PH?'390':'1440'}</h1><p class="sub">${d}</p><div class="g" style="--cw:${PH?'100%':'360px'}">${cells.map(c=>cell(c[0],c[1])).join('')}</div>`;
</script></body></html>
