<!-- Floor stage + dock. Stage ends above the dock; floor svg lives inside .stage only. -->
<main class="stage" id="stage"><!-- floor svg --></main>
<footer class="dock" id="dock">
  <div class="left"><!-- reconnect flag stack goes here, above the crew pill -->
    <div class="crew"><span class="av"><i style="background:#1E1E1E">GB</i><i style="background:#4F6FA8">M</i><i style="background:#1F6B5C">I</i></span>Your team finished 6 jobs today</div>
  </div>
  <div class="mid">
    <h2>Tell your team what to do</h2>
    <div class="chips"><span class="chip">Instinct, say hello</span><span class="chip">Muse drafts a note, Grok Bot checks it</span><span class="chip">Research flights to Lisbon</span></div>
    <label class="typebox"><input placeholder="Type a message for the team…"><button class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></label>
  </div>
  <div class="right"><div class="zoom"><button>−</button><button>+</button></div></div>
</footer>
