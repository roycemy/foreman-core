<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/topbar.css"><link rel="stylesheet" href="../components/dock.css">
<link rel="stylesheet" href="../components/reconnect-flag.css"><link rel="stylesheet" href="../components/receipt-ship.css"><link rel="stylesheet" href="../components/meeting.css">
<style>
.ov{position:absolute;z-index:4} .night .stage{background:#E9E9EA} .night .hq{filter:saturate(.85) brightness(.93)}
.recap{position:fixed;top:calc(var(--topbar) + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-float);padding:12px 16px;display:flex;gap:14px;align-items:center;z-index:6;font:var(--t-sm)}
.recap{max-width:calc(100vw - 24px);width:max-content} .recap b{font-weight:600;white-space:nowrap} @media(max-width:700px){.recap{flex-wrap:wrap;gap:6px 12px}} .recap .x{color:var(--mute)} .recap .w{display:flex;gap:3px} .recap .w i{width:6px;height:14px;border-radius:2px;background:var(--line-2)} .recap .w i.on{background:var(--ink)}
.before .stage{bottom:0} .before .stage::after,.before .stage::before{display:none} .before .dock{background:none}
.anno{position:fixed;z-index:30;font:600 13px var(--font);background:#111;color:#fff;border-radius:8px;padding:6px 10px}
.hot{fill:#FBEDE9!important}
.lit-arrow{position:fixed;z-index:30}
</style></head><body>
<header class="top"><div class="brand" id="brand"></div><nav class="nav"><a class="on">Floor</a><a id="rtab">Receipts</a><a>Card</a></nav><div class="sp"></div><div class="search">Search or jump to a bot <span>⌘K</span></div><button class="rphone" id="rph" aria-label="Receipts"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="#111" stroke-width="1.5"><path d="M5 2.5h10v15l-2.5-1.5L10 17.5 7.5 16 5 17.5z"/><path d="M7.5 7h5M7.5 10h5"/></svg></button><button class="inbox" id="inbox">Inbox</button><div class="me">R</div></header>
<main class="stage" id="stage"></main>
<footer class="dock" id="dock"><div class="left" id="left"><div class="crew"><span class="av"><i style="background:#1E1E1E">GB</i><i style="background:#4F6FA8">M</i><i style="background:#1F6B5C">I</i></span><span id="crewt">Your team finished 6 jobs today</span></div></div>
<div class="mid"><h2>Tell your team what to do</h2><div class="chips"><span class="chip">Instinct, say hello</span><span class="chip">Muse drafts a note, Grok Bot checks it</span><span class="chip">Research flights to Lisbon</span></div>
<label class="typebox"><input id="inp" placeholder="Type a message for the team…"><button class="send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></label></div>
<div class="right"><div class="zoom"><button>−</button><button>+</button></div></div></footer>
<script src="iso.js"></script><script src="demo-bots.js"></script><script src="../brand/logos.js"></script><script src="../components/dock.js"></script>
<script>
const q=new URLSearchParams(location.search),g=k=>q.get(k);
document.getElementById('brand').innerHTML=LOGOS[CHOSEN].f(g('lit')==='1')+'alter';
const B=BOTS; let bots=[B.grok,B.instinct,B.muse];
if(g('many'))bots=[{...B.grok,working:1},{...B.instinct,working:1},{...B.muse,working:1},{...B.ledger,working:1},{...B.post,working:1},{...B.scout,x:30,y:30,working:1},{...B.idle1}];
if(g('work')==='walk')bots=[{...B.grok,x:12,y:20,working:1},B.instinct,B.muse];
if(g('work')==='gather')bots=[{...B.grok,x:7,y:9,bob:1,working:1},B.instinct,B.muse];
if(g('work')==='carry')bots=[{...B.grok,x:16,y:24,carry:1,working:1},B.instinct,B.muse];
if(g('meet'))bots=[{...B.grok,x:54,y:66,working:1},{...B.instinct,x:72,y:54,working:1},B.muse];
if(g('labels'))bots=bots.map(b=>({...b,label:b.name}));
let mode=g('mode')||'after'; if(mode==='before')document.body.classList.add('before');
if(g('night'))document.body.classList.add('night');
const stage=document.getElementById('stage');
stage.innerHTML=ISO.render({bots,lit:g('lit')==='1',hover:g('hover'),meetGlow:!!g('meet'),tint:g('tint')!=='0'});
const svg=stage.querySelector('svg');
let pan=[0,+(g('py')||0)], z=+(g('z')||(innerWidth<700?1.55:1));
if(mode==='pan'){AlterDock.setPanning(true);const r=stage.getBoundingClientRect(),bb=svg.getBBox(),m=svg.getScreenCTM();pan=AlterDock.clamp(pan,bb.width*m.a*z,bb.height*m.d*z,r.width,r.height);}
svg.style.transform=`translate(${pan[0]}px,${pan[1]}px) scale(${z})`;
if(g('lit')==='1'){document.getElementById('inbox').innerHTML='<span class="d"></span>2 need you';}
if(g('newbadge')){document.getElementById('rph').insertAdjacentHTML('beforeend','<span class="badge-new">2</span>');document.getElementById('rtab').innerHTML='Receipts <span class="badge-new">2 new</span>';}
const W2S=(x,y,zz=0)=>{const[a,b]=ISO.P(x,y,zz);const p=svg.createSVGPoint();p.x=a;p.y=b;const m=svg.getScreenCTM();const t=p.matrixTransform(m);return[t.x,t.y];};
const add=(html,xy,cls='ov')=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;if(cls!=='recap'){d.style.left=xy[0]+'px';d.style.top=xy[1]+'px';}document.body.appendChild(d);return d;};
requestAnimationFrame(()=>{
 if(g('meet')){const p=W2S(62,58,16);const d=add('<div class="bubble" style="position:static;transform:none"><span class="file"></span>Handing you the research</div>',p);d.style.transform='translate(-50%,-100%)';}
 if(g('hover')){const R=ISO.ROOMS[g('hover')];const[x0,y0,x1,y1]=R.b;const p=W2S((x0+x1)/2,(y0+y1)/2,14);const info={meeting:'Handoffs and shared files',library:'Web research and reading',studio:'Notes and drafts',review:'Checks before anything ships',outbox:'Messages waiting to send',spend:'Card purchases and approvals',lounge:'Queued and idle bots'}[g('hover')];add(`<div class="roomtip" style="position:static;transform:none"><b>${R.name}</b>${info}${g('hover')==='meeting'?' · Grok Bot, Instinct here':''}</div>`,p).style.transform='translate(-50%,-100%)';}
 if(g('flag')){const L=document.getElementById('left'),f=g('flag');const why=g('why')||'Its session expired';let h='';
  if(f==='one')h=`<div class="rflag"><span class="d"></span><b>Reconnect Grok Bot</b><p>${why}</p><button>Copy fix</button></div>`;
  if(f==='stack')h=`<div class="rstack"><div class="rflag"><span class="d"></span><b>3 bots need reconnecting</b><p>Grok Bot, Instinct, Muse</p><button>Review</button></div><div class="rflag peek"></div><div class="rflag peek p2"></div></div>`;
  if(f==='paste')h=`<div class="paste"><div class="row"><span class="ok"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg></span>Copied. Just paste it.</div><p>Paste the message into Grok's chat and send.</p><div class="act"><button class="btn pri">Open Grok's chat</button><button class="btn">Done</button></div></div>`;
  L.insertAdjacentHTML('afterbegin',h);}
 if(g('ship')){const t=(innerWidth<700?document.getElementById('rph'):document.getElementById('rtab')).getBoundingClientRect();const s=W2S(22,30,14);const k=+g('ship');const x=s[0]+(t.left-s[0])*k,y=s[1]+(t.bottom-s[1])*(1-Math.pow(1-k,2));
  const p=document.createElementNS('http://www.w3.org/2000/svg','svg');p.setAttribute('style','position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none');p.innerHTML=`<path d="M${s[0]},${s[1]} Q${s[0]+(t.left-s[0])*.15},${t.bottom+20} ${t.left+20},${t.bottom}" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="2 5" opacity=".35"/>`;document.body.appendChild(p);
  const c=add(`<div class="rcard" style="transform:scale(${1-.6*k});transform-origin:top left;opacity:${k>.85?.6:1}"><div class="h"><i style="background:#1E1E1E">GB</i>Grok Bot · done</div><b>Lisbon flight options</b><div class="r">3 options under $420</div><div class="c"><span>Model costs</span><span>$0.04</span></div></div>`,[x,y]);c.style.zIndex=21;}
 if(g('recap')){add(`<b>Good morning, Royce.</b><span>4 jobs done overnight · $0.31 in model costs</span><span class="w" title="Days you checked in this week"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><span class="x">✕</span>`,[0,0],'recap');}
 if(g('crew'))document.getElementById('crewt').textContent=g('crew');
});
</script></body></html>
