<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/reconnect-flag.css"><link rel="stylesheet" href="../components/receipt-ship.css"><link rel="stylesheet" href="../components/bot-status.css"><link rel="stylesheet" href="../components/estimate.css"><link rel="stylesheet" href="../components/meeting.css"><link rel="stylesheet" href="../components/topbar.css">
<style>
body{padding:40px 48px 56px} h1{font:600 var(--t-xl);letter-spacing:-.025em;margin:0 0 6px} .lede{color:var(--stone);margin:0 0 32px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.cell{background:#ECEBE6;border-radius:var(--r-xl);padding:28px 24px 20px;display:flex;flex-direction:column;gap:14px;min-height:150px}
.cell .lab{font:500 var(--t-xs);color:var(--stone);margin-top:auto}
.cell.wide{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.logo{display:flex;flex-direction:column;gap:16px}
.lg{display:flex;gap:18px;align-items:center} .lg svg{height:56px} .word{display:flex;align-items:center;gap:8px;font:600 22px var(--font);letter-spacing:-.03em} .word svg{height:26px}
.icon{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line)} .icon svg{width:54px;height:auto} .icon.dk{background:#111;border-color:#111}
.fav{display:flex;gap:10px;align-items:center} .fav span{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:4px} .fav svg{width:100%}
.pick{outline:2px solid var(--ink);outline-offset:-2px}
.note{font:var(--t-sm);color:var(--stone)}
.tab{display:flex;align-items:center;gap:6px;font:500 var(--t-sm);padding:8px 12px;border-radius:10px;width:max-content}
.tab.on{background:#E2E1DC}
@media (max-width:700px){body{padding:24px 16px 40px}.grid{grid-template-columns:1fr}h1{font:600 var(--t-lg)}.cell{padding:20px 16px}}
.sheet{position:relative;width:100%;height:240px;border-radius:var(--r-lg);overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.sheet svg.hq{position:absolute;inset:-10% -20%;width:140%;height:120%}
</style></head><body><div id="root"></div>
<script src="iso.js"></script><script src="demo-bots.js"></script><script src="../brand/logos.js"></script><script src="../components/bot-status.js"></script><script src="../components/estimate.js"></script>
<script>
const c=new URLSearchParams(location.search).get('c'),R=document.getElementById('root');
const cell=(h,lab,cls='')=>`<div class="cell ${cls}">${h}<div class="lab">${lab}</div></div>`;
const ok='<span class="ok"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg></span>';
const P={
reconnect:()=>['Reconnect flag','A white card with a thin red edge sits above the crew pill. One line of why, one action. Copying turns it calm ink.',
 [['session expired','Its session expired'],['renewal token reused','Its renewal token was reused'],['saved login missing','Its saved login is missing'],['access revoked','Its access was revoked'],['quiet 30+ min','Quiet for 30+ min']].map(([l,w])=>cell(`<div class="rflag"><span class="d"></span><b>Reconnect Grok Bot</b><p>${w}</p><button>Copy fix</button></div>`,'Single · '+l)).join('')
 +cell(`<div class="rflag copied"><span class="d"></span><b>Reconnect Grok Bot</b><p>Now paste it in Grok's chat</p><button>Copied</button></div>`,'Copied (calm ink confirmation, 450 ms, then paste card)')
 +cell(`<div class="rstack"><div class="rflag"><span class="d"></span><b>3 bots need reconnecting</b><p>Grok Bot, Instinct, Muse</p><button>Review</button></div><div class="rflag peek"></div><div class="rflag peek p2"></div></div>`,'Stacked · collapsed')
 +cell(`<div class="rflags"><div class="rflag"><span class="d"></span><b>Grok Bot</b><p>Its session expired</p><button>Copy fix</button></div><div class="rflag"><span class="d"></span><b>Instinct</b><p>Quiet for 30+ min</p><button>Pair</button></div><div class="rflag copied"><span class="d"></span><b>Muse</b><p>Now paste it in Grok's chat</p><button>Copied</button></div></div>`,'Stacked · expanded (tap the stack)')
 +cell(`<div class="paste"><div class="row">${ok}Copied. Just paste it.</div><p>Paste the message into Grok's chat and send.</p><div class="act"><button class="btn pri">Open Grok's chat</button><button class="btn">Done</button></div></div>`,'Just paste card · Grok bots')
 +cell(`<div class="paste"><div class="row">Pair Instinct</div><p>Enter this one-time code in its console.</p><div class="code">K7Q-42M</div><div class="act"><button class="btn pri">Copy code</button><button class="btn">Done</button></div></div>`,'Console bots · one-time pairing code (mono, real code only)')],
receipts:()=>['Receipts that ship','When a job finishes, its receipt flies from the bot to the Receipts tab in 0.8 s and lands as a red “N new” badge.',
 cell(`<div class="rcard"><div class="h"><i style="background:#1E1E1E">GB</i>Grok Bot · done</div><b>Lisbon flight options</b><div class="r">3 options under $420</div><div class="c"><span>Model costs</span><span>$0.04</span></div></div>`,'Receipt card · 240 px')
 +cell(`<div class="rcard"><div class="h"><i style="background:#4F6FA8">M</i>Muse · done</div><b>Weekly memo draft</b><div class="r">Draft ready for review</div><div class="c"><span>Model costs</span><span>$0.02</span></div></div>`,'Receipt card · draft')
 +cell(`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><span class="tab on">Receipts</span><span class="tab">Receipts <span class="badge-new">1 new</span></span><span class="tab">Receipts <span class="badge-new">12 new</span></span></div>`,'Tab · none, 1 new, 12 new (badge bumps 1.18× on land)')
 +cell(`<svg viewBox="0 0 340 150" width="100%"><path d="M30,130 Q80,20 320,18" fill="none" stroke="#111" stroke-dasharray="2 6" opacity=".4"/><g opacity=".25"><rect x="18" y="104" width="90" height="38" rx="7" fill="#fff" stroke="#ccc"/></g><g opacity=".5"><rect x="96" y="50" width="60" height="26" rx="6" fill="#fff" stroke="#ccc"/></g><rect x="236" y="20" width="26" height="12" rx="3" fill="#fff" stroke="#ccc"/><rect x="290" y="8" width="46" height="20" rx="10" fill="#E2E1DC"/><circle cx="330" cy="8" r="6" fill="#E8452C"/><text x="20" y="148" font-size="10" fill="#8C8B85" font-family="Geist">0 ms</text><text x="120" y="96" font-size="10" fill="#8C8B85" font-family="Geist">320 ms</text><text x="232" y="48" font-size="10" fill="#8C8B85" font-family="Geist">800 ms · fade</text></svg>`,'Flight path · quadratic arc, ease-out (.16,1,.3,1), scale 1 → .18, fade last 20%. Reduced motion: card appears under the tab and fades in 200 ms')
 +cell(`<div class="rlist"><div class="rrow new"><i style="background:#1E1E1E">GB</i><div><b>Lisbon flight options<span class="nt">New</span></b><small>Grok Bot · 2 min ago</small></div><div class="amt">$0.04<small>model costs</small></div></div><div class="rrow new"><i style="background:#4F6FA8">M</i><div><b>Weekly memo draft<span class="nt">New</span></b><small>Muse · 9 min ago</small></div><div class="amt">$0.02<small>model costs</small></div></div><div class="rrow"><i style="background:#1F6B5C">I</i><div><b>Desk lamp</b><small>Instinct · Yesterday</small></div><div class="amt">$38.00<small>card</small></div></div></div>`,'Receipts list · new rows get a warm wash + ink edge for this visit only; badge clears on open','wide')],
status:()=>['Honest status','The bot card says Working only when a job is truly running. Everything else says what is actually happening.',
 [{n:'Grok Bot',c:'#1E1E1E',i:'GB',runningJob:{title:'Lisbon flight options'}},{n:'Muse',c:'#4F6FA8',i:'M',lastSeen:Date.now()-4*60000,cadence:5,name:'Grok'},{n:'Instinct',c:'#1F6B5C',i:'I',needsReconnect:1,reasonText:'Its session expired'},{n:'Ledger',c:'#8A6E4E',i:'L',paused:1}].map(a=>{const s=BotStatus(a);return cell(`<div class="bcard ${s.cls}"><span class="av" style="background:${a.c}">${a.i}</span><span class="n">${a.n}</span><span class="st">${s.cls==='working'?'<span class="wkline"></span>':''}${s.line}</span>${s.why?`<span class="why">${s.why}</span>`:''}${s.act?`<button class="act">${s.act}</button>`:''}</div>`,{working:'Working',queued:'Queued',reconnect:'Needs reconnect',paused:'Paused'}[s.cls]);}).join('')],
estimate:()=>['Job time estimates','From the median of the bot’s last 10 jobs (at least 3). Whole minutes, a soft bar with no end tick, always labelled estimate.',
 cell(`<div class="panel" style="max-width:420px;width:100%">${[['Lisbon flight options','Running',{cls:'run',text:'~4 min left (estimate)',frac:.45}],['Vendor research','Running',{cls:'long',text:'Taking longer than usual (usually about 6 min)',frac:1}],['Weekly memo','Queued',{cls:'idle',text:'Usually about 6 min once started (estimate)',frac:0}],['First job for Ledger','Queued',{cls:'none',text:'No estimate yet'}]].map(([t,s,e])=>`<div class="jrow"><b>${t}</b><span class="s">${s}</span><div class="est ${e.cls}">${e.cls==='run'||e.cls==='long'?`<span class="bar"><i style="width:${e.frac*100}%"></i></span>`:''}${e.text}</div></div>`).join('')}</div>`,'Inspector rows · all four states','wide')],
logo:()=>['Logo options · HQ-faithful','Each mark is the island: porcelain top, ink band, tiny walls. The red dot shows only when someone is there or something waits.',
 Object.entries(LOGOS).map(([k,o])=>cell(`<div class="logo"><div class="lg">${o.f(false)}${o.f(true)}</div><div class="word">${o.f(true)}alter</div><div class="lg"><span class="icon">${o.f(true)}</span><span class="icon dk">${o.f(true,1)}</span><div class="fav"><span style="width:32px;height:32px;padding:3px">${o.f(true)}</span><span style="width:16px;height:16px;padding:1px">${o.f(true)}</span></div></div></div>`,`${k} · ${o.name}${k===CHOSEN?' · pick':''} — ${o.note}`,k===CHOSEN?'pick':'')).join('')],
rooms:()=>['Rooms with real jobs','Seven rooms, each tied to something the backend actually does. Hover shows the room name and who is in it.',
 Object.entries(ISO.ROOMS).map(([k,r])=>cell(`<div style="display:flex;gap:12px;align-items:center"><span style="width:34px;height:34px;border-radius:10px;background:${r.tint};border:1px solid var(--line)"></span><div><b style="font:600 var(--t-sm)">${r.name}</b><div class="note">${{library:'web.fetch and research jobs',studio:'notes.write, drafts, creative',review:'review steps in a handoff plan, approvals check',outbox:'sends and connector writes awaiting delivery',meeting:'work.handoff between two bots',spend:'card purchases, spend rules, Ask decisions',lounge:'queued, idle, paused, between check-ins'}[k]}</div></div></div>`,'Trigger')).join('')]
};
const [t,l,h]=P[c]();R.innerHTML=`<h1>${t}</h1><p class="lede">${l}</p><div class="grid">${h}</div>`;
</script></body></html>
