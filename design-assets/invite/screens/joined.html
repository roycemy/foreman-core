<!doctype html><html><head><meta name=viewport content="width=device-width"><link rel=stylesheet href=base.css><style>
.top{display:flex;align-items:center;gap:8px;padding:18px 24px;font:600 17px Geist;letter-spacing:-.02em}
.w{padding:24px 24px 32px;max-width:520px;margin:0 auto}
.k{font-size:15px;color:var(--stone)}
.num{font-size:120px;font-weight:600;letter-spacing:-.06em;line-height:.95;margin-top:6px;display:flex;align-items:flex-start}
.num i{font-style:normal;font-size:56px;margin-top:12px;color:var(--mute);letter-spacing:-.03em;margin-right:4px}
.sub{margin-top:14px;font-size:17px;color:var(--stone);line-height:1.4}
.card{margin-top:28px;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:var(--s)}
.card img{display:block;width:100%}
.sec{margin-top:24px;font:600 15px Geist;letter-spacing:-.015em}
.link{margin-top:10px;display:flex;align-items:center;gap:10px;height:52px;border-radius:12px;background:var(--s);box-shadow:inset 0 0 0 1px var(--line2);padding:0 6px 0 16px}
.link .code{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link button{height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--ink);color:#fff;font:500 14px Geist}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.go{margin-top:28px}
@media(min-width:900px){.w>div:last-child .sec{margin-top:0!important}.w{max-width:1100px;display:grid;grid-template-columns:1fr 520px;gap:80px;padding-top:80px;align-items:start}.card{margin-top:0}.num{font-size:180px}.num i{font-size:80px;margin-top:20px}}
.top circle{display:none}</style></head><body>
<div class=top><svg class="mark" width="28" height="28" viewBox="0 0 64 64"><path d="M8 33 V37 L32 49 L56 37 V33" fill="#111" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M8 33 L32 21 L56 33 L32 45 Z" fill="#F4F3EF" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/><circle cx="36" cy="33" r="4" fill="#E2452B"/></svg> Alter</div>
<div class=w><div>
<p class=k>You're in. Founding member</p>
<div class=num><i>#</i>215</div>
<p class=sub>Your seat in HQ is ready. Connect your first bot and it walks in.</p>
<p class=sec>Your invite link</p>
<div class=link><span class=code>alterhq.app/i/maya</span><button>Copy</button></div>
<div class=row><button class="btn o">Share card</button><button class="btn o">Save image</button></div>
<button class="btn go">Open your HQ</button>
</div>
<div><p class=sec style="margin-top:28px">Your card</p><div class=card style="margin-top:10px"><img src="../shots/04-share-card-1080x1350.png"></div></div>
</div></body></html>
