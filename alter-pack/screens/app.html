<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F4F4F1;--sf:#FFFFFF;--ink:#121212;--stone:#5C5C57;--mute:#8C8C86;--line:rgba(18,18,18,.08);--line2:rgba(18,18,18,.14);--v:#E2452B;--vd:#C8361D;--vt:rgba(226,69,43,.08);--g:#1C7A4A;
--r1:10px;--r2:14px;--r3:20px;--sh1:0 1px 2px rgba(18,18,18,.04),0 1px 1px rgba(18,18,18,.03);--sh2:0 1px 2px rgba(18,18,18,.04),0 12px 32px -8px rgba(18,18,18,.12);--sh3:0 2px 4px rgba(18,18,18,.04),0 24px 64px -12px rgba(18,18,18,.22)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:400 14px/1.45 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0}
.top{height:60px;display:flex;align-items:center;gap:28px;padding:0 24px;background:rgba(244,244,241,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:relative;z-index:5}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.mark i{width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;position:relative}.mark i::after{content:"";position:absolute;left:2px;right:2px;top:2px;height:3px;background:var(--v);border-radius:1px}
.nav{display:flex;gap:4px}.nav a{padding:7px 12px;border-radius:9px;color:var(--stone);font-weight:500;text-decoration:none}.nav a.on{color:var(--ink);background:rgba(18,18,18,.05)}
.sp{flex:1}
.kbar{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border-radius:10px;background:var(--sf);box-shadow:var(--sh1);border:1px solid var(--line);color:var(--mute);width:240px;font-size:13px}.kbar span:last-child{margin-left:auto;font-size:12px}
.ibtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;border-radius:10px;font-weight:500;border:1px solid var(--line2);background:var(--sf)}

.ibtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
/* floor */
.stage{position:relative;height:calc(100vh - 60px);overflow:hidden}
.floor{position:absolute;width:1260px;aspect-ratio:1320/750;left:50%;top:50%;transform:translate(-50%,-52%)}
.floor img.flart{width:100%;height:100%;display:block}
.floor svg.rooms{position:absolute;inset:0;width:100%;height:100%}
.fig{position:absolute;transform:translate(-50%,-100%)}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--sf);border-radius:12px 12px 12px 4px;box-shadow:var(--sh2);padding:7px 10px;display:flex;gap:4px}
.bubble i{width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.35}.bubble i:nth-child(2){opacity:.6}.bubble i:nth-child(3){opacity:.9}
.tip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;box-shadow:var(--sh2);white-space:nowrap}
.tip small{display:block;color:rgba(255,255,255,.62);font-weight:400;font-size:12px}
.need{position:absolute;transform:translate(-50%,-100%);width:10px;height:10px;border-radius:50%;background:var(--v);box-shadow:0 0 0 4px rgba(226,69,43,.16)}
.crew{position:absolute;left:24px;bottom:24px;display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--line);box-shadow:var(--sh2);border-radius:14px;padding:8px 14px 8px 8px}
.stack{display:flex}.stack span{width:28px;height:28px;border-radius:50%;border:2px solid var(--sf);margin-left:-8px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600}.stack span:first-child{margin-left:0}
.crew p{font-size:13px;color:var(--stone)}.crew p b{color:var(--ink);font-weight:600}
.zoom{position:absolute;right:24px;bottom:24px;display:flex;background:var(--sf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh1)}.zoom button{width:36px;height:36px;color:var(--stone);font-size:16px}
.ask{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:520px;height:48px;border-radius:14px;background:var(--sf);border:1px solid var(--line);box-shadow:var(--sh2);display:flex;align-items:center;padding:0 8px 0 18px;color:var(--mute)}
.ask span:last-child{margin-left:auto;width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px}
/* panels */
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:420px;background:var(--sf);border-radius:var(--r3);box-shadow:var(--sh3);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:20px 20px 12px;display:flex;align-items:center;gap:12px}.ph h2{font-size:17px;font-weight:600;letter-spacing:-.02em}.ph .x{margin-left:auto;width:30px;height:30px;border-radius:9px;color:var(--stone);display:grid;place-items:center;font-size:16px}
.sec{padding:6px 20px;font-size:12px;color:var(--mute);font-weight:500}
.appr{margin:4px 12px 8px;padding:14px;border-radius:var(--r2);background:var(--bg);}
.appr .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--stone)}.appr .who .av{width:22px;height:22px;font-size:9px}
.appr h4{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:8px 0 2px}.appr p{font-size:13px;color:var(--stone)}
.btns{display:flex;gap:8px;margin-top:12px}.b{height:36px;border-radius:10px;padding:0 14px;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center}
.b.pri{background:var(--v);color:#fff}.b.sec2{background:var(--sf);border:1px solid var(--line2)}.b.ghost{color:var(--stone)}.b.ink{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--mute);font-size:12.5px}
.st{font-size:12.5px;color:var(--stone);display:flex;align-items:center;gap:6px}.st i{width:6px;height:6px;border-radius:50%;background:var(--ink)}.st.run i{background:var(--ink);box-shadow:0 0 0 3px rgba(18,18,18,.08)}.st.done i{background:transparent;border:1.5px solid var(--stone)}.st.q i{background:transparent;border:1.5px dashed var(--mute)}
.fa{width:30px;height:30px;border-radius:10px;background:var(--bg);overflow:hidden;flex:none;display:grid;place-items:end center}.fa img{width:26px}
.dim{position:absolute;inset:0;background:rgba(244,244,241,.35)}
/* inspector */

.ins-fig{width:72px;height:72px;border-radius:18px;background:linear-gradient(180deg,#EDEDE8,#E4E4DE);display:grid;place-items:end center;overflow:hidden}.ins-fig img{width:50px;margin-bottom:-2px}
.ins-h h2{font-size:22px;font-weight:600;letter-spacing:-.025em}.ins-h p{color:var(--stone);font-size:13.5px;margin-top:2px}
.seg{margin:0 24px 8px;display:flex;background:var(--bg);border-radius:11px;padding:3px}.seg button{flex:1;height:32px;border-radius:9px;font-weight:500;font-size:13px;color:var(--stone)}.seg .on{background:var(--sf);color:var(--ink);box-shadow:var(--sh1)}
.job{padding:14px 24px;border-top:1px solid var(--line)}.job.open{background:#FAFAF8}
.job .jh{display:flex;align-items:center;gap:10px}.job .jh b{flex:1;font-weight:500}.job .jh small{color:var(--mute)}
.steps{margin:14px 0 4px 3px;border-left:1px solid var(--line2);padding-left:16px;display:grid;gap:12px}
.steps div{position:relative;font-size:13px}.steps div::before{content:"";position:absolute;left:-20px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--sf);border:1.5px solid var(--ink)}
.steps div.ap::before{background:var(--v);border-color:var(--v)}.steps small{color:var(--mute);display:block;font-size:12px}

.tog{width:36px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex:none}.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}.tog.on{background:var(--ink)}.tog.on::after{left:16px}
.sel{font-size:13px;color:var(--stone);display:flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:9px;background:var(--bg)}
/* mobile */
.m{width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg)}
.mh{padding:58px 20px 8px;display:flex;align-items:flex-end}.mh h1{font-size:30px;font-weight:600;letter-spacing:-.035em}.mh .av{margin-left:auto}

.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 24px 28px;background:rgba(244,244,241,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--mute);text-decoration:none}.tabs a.on{color:var(--ink)}
.tabs svg{width:22px;height:22px}
.mcard{margin:0 16px 10px;background:var(--sf);border-radius:18px;box-shadow:var(--sh1);border:1px solid var(--line);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--sf)}.mrow+.mrow{border-top:1px solid var(--line)}
.swipe{position:relative;overflow:hidden;border-radius:18px;margin:0 16px 10px}
.swipe .act{position:absolute;inset:0;display:flex;justify-content:flex-end}.swipe .act div{width:96px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
.swipe .card{position:relative;transform:translateX(-110px);border-radius:18px 0 0 18px;background:var(--sf);padding:16px;border-right:1px solid var(--line)}
.fab{position:absolute;right:20px;bottom:100px;height:48px;padding:0 18px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;font-weight:500;box-shadow:var(--sh3)}
/* receipt */
.rc{max-width:600px;margin:0 auto;padding:40px 24px 32px}
.eyb{display:flex;align-items:center;gap:8px;color:var(--stone);font-size:13px;font-weight:500}
.rc h1{text-wrap:balance;font-size:34px;line-height:1.08;font-weight:600;letter-spacing:-.035em;margin:18px 0 10px}
.rc .lede{color:var(--stone);font-size:16px}
.art{margin:28px 0 0;background:var(--sf);border-radius:20px;box-shadow:var(--sh2);border:1px solid var(--line);overflow:hidden}
.art .prev{height:220px;background:linear-gradient(135deg,#1b1b1a,#2a2826);position:relative;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}

.art .prev .chip{position:absolute;left:22px;top:20px;font-size:12px;opacity:.7}
.art .prev .sw{position:absolute;right:22px;top:22px;width:46px;height:46px;border-radius:12px;background:var(--v)}
.art .meta{display:flex;align-items:center;padding:14px 18px;gap:10px}.art .meta b{font-weight:500}.art .meta small{color:var(--mute);margin-left:auto}
.costs{display:flex;gap:0;margin:20px 0 0;background:var(--sf);border:1px solid var(--line);border-radius:16px}
.costs div{flex:1;padding:14px 16px}.costs div+div{border-left:1px solid var(--line)}.costs b{display:block;font-size:20px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.costs small{color:var(--stone);font-size:12.5px}
.honest{color:var(--mute);font-size:12.5px;margin-top:10px}
.tl{margin-top:30px}.tl h5{font-size:13px;font-weight:600;margin-bottom:14px}
.tl .steps{margin-left:4px}.tl .steps div{font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;margin-top:32px}
.cta+p{text-align:center;color:var(--mute);font-size:12.5px;margin-top:10px}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-size:12.5px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.foot .mark{font-size:13px;color:var(--ink)}.foot .mark i{width:14px;height:14px;border-width:1.5px;border-radius:4px}.foot .mark i::after{height:2px;top:2px}
/* card */
.cc{width:340px;height:214px;border-radius:20px;background:linear-gradient(140deg,#1d1d1c 0%,#121212 60%,#262421 100%);color:#fff;position:relative;padding:22px;box-shadow:0 30px 60px -20px rgba(18,18,18,.45),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.cc::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(226,69,43,.35),transparent 65%)}
.cc .mark{color:#fff;font-size:14px}.cc .mark i{border-color:#fff}
.cc .num{position:absolute;left:22px;bottom:46px;font-size:17px;letter-spacing:.12em;font-variant-numeric:tabular-nums;opacity:.9}
.cc .nm{position:absolute;left:22px;bottom:20px;font-size:12px;opacity:.6}.cc .vv{position:absolute;right:22px;bottom:20px;font-size:12px;opacity:.6}
.bar{height:8px;border-radius:4px;background:rgba(18,18,18,.07);overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.big{font-size:40px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.note{display:flex;gap:8px;align-items:center;color:var(--stone);font-size:13px}.note i{width:6px;height:6px;border-radius:50%;background:var(--v)}

/* ---- vNext.2 additions ---- */
.pop{position:absolute;top:56px;right:64px;width:392px;background:var(--sf);border-radius:16px;box-shadow:var(--sh3);border:1px solid var(--line);z-index:20;overflow:hidden}
.pop::before{content:"";position:absolute;top:-6px;right:44px;width:12px;height:12px;background:var(--sf);transform:rotate(45deg);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.pop h3{font-size:15px;font-weight:600;letter-spacing:-.015em;padding:16px 18px 10px;display:flex;align-items:baseline;gap:8px}.pop h3 span{color:var(--mute);font-weight:400;font-size:13px}
.pr{display:flex;gap:12px;padding:14px 18px;border-top:1px solid var(--line);align-items:flex-start}.pr .t{flex:1;min-width:0}.pr b{display:block;font-weight:500}.pr small{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.pr .btns{margin-top:10px}.pr .b{height:32px;font-size:13px;padding:0 12px;border-radius:9px}
.popf{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:#FAFAF8;font-size:13px;color:var(--stone)}.popf a{color:var(--ink);font-weight:500}
.empty{padding:28px 24px 30px;text-align:center}.empty .ok{width:40px;height:40px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--bg)}.empty b{display:block;font-weight:600;font-size:15px}.empty small{color:var(--stone);font-size:13px}
.duo{display:flex}.duo span{width:22px;height:22px;border-radius:50%;border:2px solid var(--sf);display:grid;place-items:center;color:#fff;font-size:9px;font-weight:600}.duo span+span{margin-left:-7px}
.collab{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:8px 12px 8px 8px;font-size:13px;white-space:nowrap}.collab b{font-weight:600}.collab small{color:var(--mute)}
.gl{position:absolute;width:22px;height:22px;border-radius:7px;background:var(--sf);box-shadow:0 1px 2px rgba(18,18,18,.08),0 4px 10px -2px rgba(18,18,18,.14);display:grid;place-items:center;transform:translate(-50%,-100%)}
.gl svg{width:13px;height:13px}.gl.emo{font-size:12px;line-height:1}
.isl-card{position:absolute;width:248px;background:var(--sf);border-radius:12px;box-shadow:var(--sh2);border:1px solid var(--line);padding:12px 14px}

.lbl{position:absolute;font-size:12px;color:var(--stone);font-weight:500}

.kh{display:flex;align-items:center;padding:56px 24px 4px}.kh h1{font-size:28px;font-weight:600;letter-spacing:-.03em}.kh .av{margin-left:auto;width:32px;height:32px}
.ks{padding:2px 24px 20px;color:var(--stone);font-size:14px}
.kl{padding:20px 24px 8px;font-size:13px;font-weight:600;color:var(--ink)}
.kr{display:flex;gap:14px;padding:16px 24px;align-items:flex-start;position:relative}.kr::after{content:"";position:absolute;left:74px;right:0;bottom:0;height:1px;background:var(--line)}
