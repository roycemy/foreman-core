name: regression
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Run every *-regression.cjs (each suite blocking)
        shell: bash
        run: |
          set -u
          n=0; failed=""
          while IFS= read -r f; do
            n=$((n+1))
            echo "::group::$f"
            if node "$f"; then echo "PASS $f"; else echo "::error::FAILED $f"; failed="$failed $f"; fi
            echo "::endgroup::"
          done < <(git ls-files '*-regression.cjs')
          echo "suites=$n failed:${failed:- none}"
          # Guard against a glob that matches nothing: 76 baseline suites + envelope-ui-regression.cjs.
          if [ "$n" -lt 77 ]; then echo "::error::only $n suites found, expected at least 77"; exit 1; fi
          if [ -n "$failed" ]; then echo "::error::suites=$n failed:$failed"; exit 1; fi
          echo "::notice::suites=$n passed=$n failed=0"
